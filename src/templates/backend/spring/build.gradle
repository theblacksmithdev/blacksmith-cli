// Spring Boot backend. Generated by Blacksmith. You own this file — customize as needed.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Compile for Java 17 on whichever JDK 17+ is installed
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs << '-parameters'
}

// One deployable jar: build/libs/app.jar
tasks.named('jar') { enabled = false }
tasks.named('bootJar') { archiveFileName = 'app.jar' }

// Tests run against an in-memory database built by the Flyway migrations
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'openapi-export' }
}

// Write the OpenAPI document without starting a server, for `blacksmith sync`:
//   ./gradlew exportOpenApi -Pout=/path/to/schema.json
tasks.register('exportOpenApi', Test) {
    description = 'Writes the OpenAPI document to the file given by -Pout.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'openapi-export' }
    systemProperty 'openapi.out', providers.gradleProperty('out')
        .orElse(layout.buildDirectory.file('openapi.json').map { it.asFile.path }).get()
    outputs.upToDateWhen { false }
}
