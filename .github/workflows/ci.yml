name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package contents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # npm silently drops some files from a published tarball (it strips any
      # `.gitignore`, and honours ignore files found inside the package). A
      # template that does not ship produces a broken generated project, so
      # assert the tarball still carries the files that bit us before.
      - name: Verify templates ship in the tarball
        run: |
          npm pack --dry-run 2>&1 | grep -oE 'src/templates/[^ ]+' | sort > packed.txt
          find src/templates -type f | sort > ondisk.txt
          if ! diff -u ondisk.txt packed.txt; then
            echo "::error::Template files are missing from the npm tarball (see diff above)"
            exit 1
          fi
          echo "All $(wc -l < ondisk.txt) template files present in the tarball."
